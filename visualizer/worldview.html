<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCAS World View</title><link rel="stylesheet" href="worldview.css"></head>
<body>
<canvas id="c" aria-label="World view of tracked orbital objects and the OCAS-1 trajectory"></canvas>
<header><h1>OCAS World View</h1><p id="src">Loading…</p></header>
<aside class="hud" id="hud">
  <h2>Tracked objects</h2><div id="legend"></div>
  <h2>Time</h2><div class="row" id="speeds"></div><div class="kv"><span>UTC</span><b id="utc"></b></div>
  <h2>OCAS-1 (our satellite)</h2>
  <label class="chip"><input type="checkbox" id="follow" checked><i style="--c:#fff"></i>Follow OCAS-1</label>
  <div class="kv"><span>Altitude</span><b id="alt"></b></div>
  <div class="kv"><span>Orbit period</span><b id="per"></b></div>
  <div class="kv"><span>Inside 100 km bubble</span><b id="near"></b></div>
  <div class="kv"><span>Nearest object</span><b id="nn"></b></div>
  <p class="small">Drag to rotate. Scroll to zoom. Solid line: where OCAS-1 has been. Dashed: its next orbit. Dotted on Earth: ground track.</p>
</aside>
<script src="coast.js"></script><script src="catalog.js" onerror="void 0"></script><script src="worldview.js"></script>
</body></html>
